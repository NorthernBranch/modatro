name: Test, build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test and compile
    runs-on: ubuntu-22.04
    outputs:
      package_desktop: ${{ steps.scope.outputs.package_desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check desktop release inputs
        id: scope
        run: node scripts/release-scope.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Assign automatic app version
        if: steps.scope.outputs.package_desktop == 'true'
        run: node scripts/build-version.mjs
      - run: pnpm install --frozen-lockfile
      - name: Check formatting, catalogue, types, unit tests and build
        run: pnpm check
      - run: pnpm exec install-electron
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run browser and source desktop tests
        run: xvfb-run -a pnpm test:ui
      - name: Check download website
        run: pnpm exec playwright test --config playwright.website.config.mjs
      - name: Preserve failed browser and desktop diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-ui-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Share tested application build
        if: steps.scope.outputs.package_desktop == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tested-desktop-build
          path: |
            dist/
            dist-electron/
            package.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: Package (${{ matrix.artifact }})
    needs: validate
    if: needs.validate.outputs.package_desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            artifact: windows-x64
            executable: release/win-unpacked/Modatro.exe
            headless: ''
          - os: macos-latest
            target: --mac --arm64
            artifact: macos-arm64
            executable: release/mac-arm64/Modatro.app/Contents/MacOS/Modatro
            headless: ''
          - os: macos-15-intel
            target: --mac --x64
            artifact: macos-x64
            executable: release/mac/Modatro.app/Contents/MacOS/Modatro
            headless: ''
          - os: ubuntu-22.04
            target: --linux --x64
            artifact: linux-x64
            executable: release/linux-unpacked/modatro
            headless: xvfb-run -a
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Restore tested application build and version
        uses: actions/download-artifact@v8
        with:
          name: tested-desktop-build
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        name: Install Linux desktop runtime dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Package installers
        run: pnpm package:desktop ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.MAC_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
      - name: Verify packaged desktop startup
        run: ${{ matrix.headless }} pnpm exec playwright test tests/desktop.spec.ts
        env:
          MODATRO_PACKAGED_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
      - uses: actions/upload-artifact@v7
        with:
          name: Modatro-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/signing-macos-*.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [validate, build]
    if: needs.validate.outputs.package_desktop == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore tested application build and version
        uses: actions/download-artifact@v8
        with:
          name: tested-desktop-build
      - uses: actions/download-artifact@v8
        with:
          pattern: Modatro-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish tested installers
        run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
