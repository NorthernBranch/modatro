name: Test, build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            artifact: windows-x64
            executable: release/win-unpacked/Modatro.exe
            headless: ''
          - os: macos-latest
            target: --mac --arm64
            artifact: macos-arm64
            executable: release/mac-arm64/Modatro.app/Contents/MacOS/Modatro
            headless: ''
          - os: macos-15-intel
            target: --mac --x64
            artifact: macos-x64
            executable: release/mac/Modatro.app/Contents/MacOS/Modatro
            headless: ''
          - os: ubuntu-22.04
            target: --linux --x64
            artifact: linux-x64
            executable: release/linux-unpacked/modatro
            headless: xvfb-run -a
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec install-electron
      - if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - run: ${{ matrix.headless }} pnpm test:ui
      - name: Package installers
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged desktop startup
        run: ${{ matrix.headless }} pnpm exec playwright test tests/desktop.spec.ts
        env:
          MODATRO_PACKAGED_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
      - uses: actions/upload-artifact@v7
        with:
          name: Modatro-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: Modatro-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish tested installers
        run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
